version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: drgodly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drgodly_admin
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: drgodly_pharmacy
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drgodly_admin -d drgodly_pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drgodly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
